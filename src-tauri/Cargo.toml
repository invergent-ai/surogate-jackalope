[package]
name = "jackalope-desktop"
version = "0.1.0"
description = "Jackalope Desktop — surogate live-training dashboard"
edition = "2021"

[lib]
name = "jackalope_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"
ureq = "2"
notify = "6"

[dev-dependencies]
tempfile = "3"
